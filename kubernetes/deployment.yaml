apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaling-website
  template:
    metadata:
      labels:
        app: scaling-website
    spec:
      containers:
        - name: scaling-website
          image: storts/scaling-website:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_ENV
              value: "production"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10